name: Keep Supabase Active

on:
  schedule:
    # Runs every 4 days at 00:00 UTC (0 0 */4 * *)
    - cron: "0 0 */4 * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install pg

      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/keep-supabase-alive.js
